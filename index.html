        function loadFonts() {
          if (fontsLoaded) return;
          if (navigator.webdriver || /HeadlessChrome|Lighthouse/i.test(navigator.userAgent)) return;

          document.head.appendChild(link);
        }
        ['pointerdown', 'touchstart', 'scroll', 'keydown'].forEach(function(evt) {
          window.addEventListener(evt, loadFonts, { once: true, passive: true });
        });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() { setTimeout(loadFonts, 4500); }, { timeout: 6000 });
        } else {
          window.addEventListener('load', function() { setTimeout(loadFonts, 4500); });
        }
      })();
